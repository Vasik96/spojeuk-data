name: Stations

# Stanoviště (sloupky) zastávek IDS DÚK z portaba pro mapu v appce a na webu: jen autobusová stanoviště se
# souřadnicemi, ze kterých během týdne něco jede (tools/build_stations.py). Odjezdy po stanovištích pak appka
# i web berou živě z portaba. Když portabo nefunguje, job selže a v release "stops" zůstane poslední verze.

on:
  schedule:
    - cron: "40 3 * * 1"   # pondělí ráno; stanoviště se mění zřídka, kontrola týdne je ~10 000 dotazů
  push:
    branches: [main]
    paths:
      - "tools/build_stations.py"
      - ".github/workflows/stations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency: stations

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout stanoviště a ověřit provoz
        run: python tools/build_stations.py --out stations.json --workers 2

      - name: Publikovat (jen při změně)
        run: |
          mkdir -p prev
          # porovnává se bez času sestavení
          strip() { python3 -c "import json,sys; d=json.load(open(sys.argv[1])); d.pop('built',None); print(json.dumps(d,sort_keys=True))" "$1"; }
          if gh release download stops -p stations.json -D prev --clobber 2>/dev/null && [ "$(strip prev/stations.json)" = "$(strip stations.json)" ]; then
            echo "Beze změny, nic se nepublikuje."
            exit 0
          fi
          gh release view stops >/dev/null 2>&1 || \
            gh release create stops --title "Stanoviště zastávek (automaticky)" \
              --notes "Stanoviště IDS DÚK pro mapu v appce a na webu, generuje workflow Stations. Needitovat ručně." --latest=false
          gh release upload stops stations.json --clobber
