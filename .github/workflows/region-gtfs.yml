# Denně zmenší GTFS z Oběhů (jdf-filtered + PID z plného jdf + czptt), postaví z nich hotovou databázi
# pro appku (tools/build_timetable_db.py) a vše nahraje do releasu "gtfs".
# Rozsah pokrývá celé Česko (spoj se bere celý, když se oblasti dotkne).
# jdf-filtered vyhazuje linky PID ("už je publikují jiné feedy"), proto se PID dobírá z plného jdf.tar
# (tools/add_pid_lines.py); bez toho appka pro PID vozidla nemá spoje ani trasy.
name: Build region GTFS
on:
  schedule: [{ cron: "15 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LAT: "48.0 51.5"
      LON: "11.5 19.5"
      REGION: cz-pid   # změň při další úpravě oblasti nebo obsahu, ať si appka stáhne nová data
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout Oběhy
        run: |
          B=https://github.com/Sap1k/obehy/releases/latest/download
          curl -fsSL -o jdf.tar   $B/jdf-filtered.tar
          curl -fsSL -o czptt.tar $B/czptt.tar
          curl -fsSL -o jdf-full.tar $B/jdf.tar      # ~1 GB, jen kvůli spojům PID
          curl -fsSI -o /dev/null -w '%{redirect_url}' $B/czptt.tar | sed -E 's#.*/download/([^/]+)/.*#\1#' > tag.txt
      - name: Přidat PID do filtrovaného JDF
        run: |
          python3 tools/add_pid_lines.py jdf.tar jdf-full.tar jdf-with-pid.zip
          rm -f jdf-full.tar
      - name: Zmenšit na oblast
        run: |
          mkdir -p out
          python3 tools/build_region_gtfs.py jdf-with-pid.zip out/jdf-region.zip --lat $LAT --lon $LON
          python3 tools/build_region_gtfs.py czptt.tar out/czptt-region.zip --lat $LAT --lon $LON
      # Hotová databáze pro appku: telefon ji jen stáhne a rozbalí (~18 MB) místo importu 540 MB stop_times.
      # Zipy zůstávají jako záloha (starší verze appky a případ, kdy stažení DB selže).
      - name: Postavit databázi jízdních řádů
        run: |
          TAG="$(cat tag.txt)-$REGION"
          python3 tools/build_timetable_db.py --bus out/jdf-region.zip --rail out/czptt-region.zip --tag "$TAG" --out static.sqlite
          gzip -9 -c static.sqlite > out/timetable.sqlite.gz
          TRIPS=$(python3 -c "import sqlite3; print(sqlite3.connect('static.sqlite').execute('select count(*) from trip').fetchone()[0])")
          SCHEMA=$(python3 -c "import sys; sys.path.insert(0,'tools'); import build_timetable_db as b; print(b.SCHEMA)")
          SHA=$(sha256sum out/timetable.sqlite.gz | cut -d' ' -f1)
          SIZE=$(stat -c %s out/timetable.sqlite.gz)
          printf '{"tag":"%s","built":"%s","db":{"name":"timetable.sqlite.gz","schema":%s,"sha256":"%s","size":%s,"trips":%s}}' \
            "$TAG" "$(date -u +%FT%TZ)" "$SCHEMA" "$SHA" "$SIZE" "$TRIPS" > out/gtfs.json
          cat out/gtfs.json
      - name: Nahrát do releasu "gtfs"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view gtfs >/dev/null 2>&1 || gh release create gtfs --title "GTFS pro appku" --notes "Generuje workflow Build region GTFS."
          # gtfs.json až nakonec: appka podle něj pozná novou verzi, soubory už musí být nahrané
          gh release upload gtfs out/timetable.sqlite.gz out/jdf-region.zip out/czptt-region.zip --clobber
          gh release upload gtfs out/gtfs.json --clobber
