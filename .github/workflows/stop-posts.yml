name: Stop posts

# Sloupky zastávek IDS DÚK (Ústí nad Labem a okolí) z portaba. Když portabo nefunguje, job selže a v release zůstane
# poslední funkční stop_posts.json (appka na portabu nezávisí).

on:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: [main]
    paths:
      - "tools/build_stop_posts.py"
      - ".github/workflows/stop-posts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency: stop-posts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout sloupky
        run: python tools/build_stop_posts.py --out stop_posts.json

      - name: Publikovat (jen při změně)
        run: |
          mkdir -p prev
          if gh release download stops -p stop_posts.json -D prev --clobber 2>/dev/null && cmp -s prev/stop_posts.json stop_posts.json; then
            echo "Beze změny, nic se nepublikuje."
            exit 0
          fi
          gh release view stops >/dev/null 2>&1 || \
            gh release create stops --title "Sloupky zastávek (automaticky)" \
              --notes "Sloupky IDS DÚK pro mapu v appce, generuje workflow Stop posts. Needitovat ručně." --latest=false
          gh release upload stops stop_posts.json --clobber
