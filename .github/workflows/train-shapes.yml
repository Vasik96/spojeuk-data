# Do repozitáře Vasik96/spojeuk-data: train_shapes.sqlite (trasy vlaků) se staví denně ve workflow region-gtfs.yml
# hned po jízdních řádech (stejný czptt.tar, přesně vlaky z czptt-region.zip). Tady jen ruční přestavění: vezme
# aktuální czptt-region.zip z releasu "gtfs", aby tvary seděly na jízdní řád, který appka má.
name: Build train shapes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download czptt.tar + czptt-region.zip
        run: |
          curl -fsSL -o czptt.tar https://github.com/Sap1k/obehy/releases/latest/download/czptt.tar
          curl -fsSL -o czptt-region.zip https://github.com/${{ github.repository }}/releases/download/gtfs/czptt-region.zip
      - name: Build
        run: python3 tools/build_train_shapes.py czptt.tar -o out --trips czptt-region.zip
      - name: Upload to release "shapes"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release upload shapes out/train_shapes.sqlite --clobber
          gh release upload shapes out/train_shapes.json --clobber
